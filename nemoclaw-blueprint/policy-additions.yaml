# Herr Claw policy additions (P5) — sandbox `my-assistant` (NemoClaw/OpenShell).
#
# Desired egress end state (SPEC §5, deny-by-default otherwise):
#   ✔ integrate.api.nvidia.com:443  — NVIDIA inference; already allowed by the
#     sandbox baseline. Sandbox agents use the gateway-routed
#     https://inference.local/v1 for the same model (raw key never enters the
#     sandbox), so nothing to add here — documented for the allowlist picture.
#   ✔ api.telegram.org:443          — covered by the `telegram` preset applied
#     at onboard; the gateway resolves TELEGRAM_BOT_TOKEN at egress, so the
#     token itself never enters the sandbox.
#   ● herrclaw-bridge (below)       — the ONE host endpoint the sandbox may
#     call: herrclaw_bridge (Apple Reminders/Calendar + scoped Obsidian vault,
#     7 audited tools) on host loopback port 8765.
#   ✘ everything else               — denied; unknown hosts go through the
#     OpenClaw TUI approval flow.
#
# Apply with:
#   nemoclaw my-assistant policy add --from-file nemoclaw-blueprint/policy-additions.yaml --dry-run
#   nemoclaw my-assistant policy add --from-file nemoclaw-blueprint/policy-additions.yaml --yes
#
# NOTE: the trigger venv's packages are vendored from the host as manylinux
# wheels (see README "Deployment") — the sandbox never talks to pypi, so no
# package-registry egress is added here at all.
#
# The bridge endpoint is the OpenShell-managed host alias `host.openshell.internal`
# (same pattern as the NVIDIA community recipes for credential-less host-routed
# services): private-range access is granted via allowed_ips, host+port+verb
# scoped to MCP's POST/GET/DELETE on /mcp.
#
# Caller scoping (the `binaries` pin) and allowed_ips cannot be carried by
# `nemoclaw policy add` (its merge normalizes both keys away), so they live in
# the gateway policy, applied with a full `openshell policy set`.
#
# LIVE state: policy v11 (2026-10-02). The herrclaw-bridge rule's binaries
# pin, exactly:
#   /sandbox/herrclaw/.venv/bin/*  +  /sandbox/herrclaw/.venv/bin/**  — trigger venv
#   /usr/bin/curl                                                     — smoke tests
#   /home/linuxbrew/.linuxbrew/Cellar/python@3.14/3.14.8/bin/python3.14
#   /home/linuxbrew/.linuxbrew/**                                     — brew runtime
#   /opt/openshell/bin/openshell-sandbox                              — sandbox infra
#   /usr/local/bin/openclaw + /usr/local/bin/node + /usr/bin/node     — THE OPENCLAW RUNTIME
#
# v11 deliberately adds the OpenClaw runtime: the sandbox agent itself may now
# call the bridge tools (its own MCP config points at the same endpoint; cron
# fires and the `turn` brain already reach it via HERR_BRIDGE_URL). The
# layering stays two-sided:
#   - WHO may dial the bridge is scoped HERE — only the binaries above; every
#     other binary in the sandbox still gets OCSF DENIED lines
#     ("binary ... not allowed") in the sandbox policy log.
#   - WHAT a call may do is enforced AT the bridge — the fixed 7-tool
#     allowlist (reminders/calendar/vault), the vault path allowlist
#     (Deutsch/, Daily notes/, Weeks/; append-only), and
#     ~/.herr-claw/audit.log, which records every call — allowed AND denied.
# The deny moment in the demo is unchanged (a vault write outside the scoped
# folders, e.g. Books/, is still denied + audited) — and since v11 it can be
# demonstrated from the agent itself, not only from a host-side test.
#
# Reproducing v11 (e.g. after a sandbox rebuild):
#   openshell policy get my-assistant --full -o json > captured.json   # baseline
#   # add the binaries above + the allowed_ips to the herrclaw-bridge rule,
#   # then apply the complete policy:
#   openshell policy set my-assistant --policy v11.yaml
# (`openshell policy update` cannot do this incrementally: it refuses to fold
# new binaries into an existing rule, and --add-allow is ambiguous once two
# rules share host:port — so the full-set path is the reproducible one. Keep
# the captured baseline; rollback is re-setting it.)
version: 1
preset:
  name: herrclaw-bridge
  description: Herr Claw P5 — allow the sandbox to reach the herrclaw_bridge MCP endpoint on host loopback :8765
network_policies:
  herrclaw-bridge:
    name: herrclaw-bridge
    endpoints:
      - host: host.openshell.internal
        port: 8765
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /mcp
          - allow:
              method: GET
              path: /mcp
          - allow:
              method: DELETE
              path: /mcp
