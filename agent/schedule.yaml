# THE daily scheduler (SPEC §4.1) — one config file, one mechanism.
# Loaded by `herr-claw daemon`; times are local laptop time.
#
# Scheduler note (AGENTS.md): this daemon loop IS the one scheduling
# mechanism — no launchd, no cron, no second loop. (P0's OpenClaw-cron
# verdict remains the sandbox-in variant; its P5 wiring is deliberately
# not built, and the host daemon realizes the same §4.1 loop.)
jobs:
  nudge: "08:00"  # Morning Nudge: freebusy → slot → Reminder + event → Telegram
  quiz: "12:30"   # Micro-quiz: 3 questions from the weakest vocab (only if the nudge ran)
  recap: "20:00"  # Recap: daily note + Deutsch/progress.md + reminders complete
# weekly_review: "Sonntag 10:00"  # CUT from demo scope (SPEC §4.1 — no Sunday before the deadline)
