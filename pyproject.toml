[project]
name = "herr-claw"
version = "0.1.0"
description = "Herr Claw — sandboxed German-tutor agent (TUI + voice + Telegram) for the NVIDIA Claw Agent Challenge"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2.0",
    # P1 (chat + memory): openai, python-dotenv, typer. P2 (Apple bridge): mcp, uvicorn,
    # pyobjc-framework-eventkit. P3 (voice): mlx-whisper, sounddevice, soundfile (already in).
    "mlx-whisper>=0.4.3",
    "openai>=1.100",
    "pyobjc-framework-eventkit>=12.2.2",
    "python-dotenv>=1.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
herr-claw = "main:cli"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["agent", "herrclaw_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
