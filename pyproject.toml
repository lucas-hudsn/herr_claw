[project]
name = "herr-claw"
version = "0.1.0"
description = "Herr Claw — sandboxed German-tutor agent (TUI + voice + Telegram) for the NVIDIA Claw Agent Challenge"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # P1 (chat + memory). P2 adds mcp + pyobjc, P3 adds mlx-whisper + sounddevice + soundfile.
    "openai>=1.100",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
herr-claw = "main:cli"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["agent", "herrclaw_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
